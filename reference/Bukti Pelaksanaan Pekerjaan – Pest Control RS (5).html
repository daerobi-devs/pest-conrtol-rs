<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bukti Pelaksanaan Pekerjaan – Pest Control RS</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f4f2;--card:#fff;--tx:#1c1c1a;--mu:#6b6b66;--bd:#d6d6d0;--pr:#c8102e;--prt:#fff;--ok:#1e7a46}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#222221;--tx:#ecece8;--mu:#9a9a94;--bd:#3a3a38;--pr:#e5484d;--ok:#4cc38a}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
.w{max-width:1100px;margin:0 auto;padding:12px}
h1{font-size:18px;margin:0}h2{font-size:15px;margin:0 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:8px 12px;cursor:pointer}
button.p{background:var(--pr);color:var(--prt);border-color:var(--pr)}button.s{background:var(--ok);color:#fff;border-color:var(--ok)}
button.x{padding:4px 8px;color:var(--pr)}
input,textarea{font:inherit;color:var(--tx);background:transparent;border:1px solid var(--bd);border-radius:6px;padding:6px;width:100%}
label{display:block;font-size:12px;color:var(--mu);font-weight:600}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.tabs button{white-space:nowrap}.tabs .on{background:var(--pr);color:var(--prt);border-color:var(--pr)}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:900px}
th,td{border:1px solid var(--bd);padding:3px;text-align:center;font-size:12px}
th.v{writing-mode:vertical-rl;transform:rotate(180deg);height:78px}
td.a{text-align:left;min-width:190px}td input{padding:4px;border-radius:4px}
td.n input{width:46px}td.k input[type=text],td.k input:not([type]){width:44px;text-align:center}
td input[type=checkbox]{width:18px;height:18px}
tr.fl td{background:color-mix(in srgb,var(--pr) 10%,transparent);font-weight:700}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.mu{color:var(--mu);font-size:13px}
.day{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sig{border:1px dashed var(--bd);border-radius:8px;padding:8px;text-align:center}
.sig img{max-width:100%;max-height:70px;display:block;margin:6px auto}
.dirty{color:var(--pr);font-weight:600;font-size:13px}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:9}

.paper-wrap{overflow-x:auto;margin-bottom:12px}
.paper{background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif;min-width:920px;padding:10px 12px;border:1px solid var(--bd)}
.paper input,.paper textarea{color:#111;border:0;border-radius:0;background:transparent;padding:2px;font-size:13px}
.paper .ph{display:flex;align-items:center;gap:18px;margin-bottom:8px}
.logo{border:3px solid #c8102e;border-radius:50%;width:150px;height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#c8102e;line-height:1}
.logo i{font-size:8px;letter-spacing:2px}.logo b{font:italic 900 26px Georgia,serif}
.pt{flex:1;text-align:center;font-size:12px}.pt h3{margin:0 0 3px;font-size:26px;letter-spacing:.5px}
.frame{border:2px solid #111}.ttl{text-align:center;font-weight:800;font-size:17px;padding:3px;border-bottom:1.5px solid #111}
.inf{display:grid;grid-template-columns:1fr 1fr;gap:2px 40px;padding:6px 10px;border-bottom:1.5px solid #111}
.fr{display:flex;align-items:center;gap:6px}.fr b{width:112px;font-size:12px;flex:none}.fr input{border-bottom:1px dotted #111;flex:1;min-width:0}
.paper table{min-width:0}.paper th,.paper td{border:1px solid #333;color:#111;height:26px;padding:0 2px}
.paper th{font-size:12px;font-weight:700}.paper th.v{height:76px;font-weight:600;font-size:11px}
.paper tr.fh td,.paper tr.fl td{background:none;font-weight:700}
.paper td.a input{text-align:left;width:100%}.paper td input{width:100%}
.paper td.o,.paper th.o{border:0!important;background:none!important;width:30px}
.paper td input[type=checkbox]{width:16px;height:16px;accent-color:#111}
.kt{font-size:12px;margin:6px 0}.bt{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.cb{border:1.5px solid #111;padding:6px;min-height:150px}.cb textarea{width:100%;height:120px}
.sg{display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;gap:10px;margin-top:12px;font-size:13px}
.sg img{max-height:60px;display:block;margin:4px auto}.sg .ln{border-bottom:1px dotted #111;min-height:20px;margin:0 14px}
.pfb{width:100%;height:26px;border:0!important;background:none!important;padding:0;color:#999;cursor:pointer}.pfb img{max-height:24px;max-width:100%;display:block;margin:0 auto}
@media print{.noprint{display:none}}
</style></head><body><div class="w" id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const KEY='laporan-vektor-v1',MET=['S','CF','HF','BT','PJ','TB'],PEST=['Jentik','Nyamuk','Lalat','Semut','Kecoa Amerika','Kecoa German','Tikus','Tomcat','Hama lain'];
const BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
let S={reports:[],months:{}},view={m:null,id:null,home:true},dirty=false,DL=null;
try{const x=localStorage.getItem(KEY);if(x)S=JSON.parse(x)}catch(e){}
let DB=null,RAW={reports:{},months:{}},IMG={},LAST={},pend=false,LOCAL=JSON.parse(JSON.stringify(S));
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const mk=d=>(d||'').slice(0,7),mName=k=>k?BLN[+k.slice(5)-1]+' '+k.slice(0,4):'';
const dm=d=>d?d.split('-').reverse().join('-'):'';
const newRoom=n=>({n:n||'',m:[1,0,0,0,0,0],h:PEST.map(()=>''),p:''});
const newFloor=i=>({no:i,name:'Lantai '+i,rooms:[newRoom()]});
const mo=k=>S.months[k]||(S.months[k]={pj:'',pw:'',dk:'',img:{}});
const hh=s=>{let h=5381;for(let i=0;i<s.length;i++)h=(h*33^s.charCodeAt(i))>>>0;return h.toString(36)+s.length.toString(36)};
function strip(r){const c=JSON.parse(JSON.stringify(r)),im={};c.floors.forEach(f=>f.rooms.forEach(m=>{if(m.pi){m.pk=hh(m.pi);im[m.pk]=m.pi}delete m.pi;if(m.dk){m.dkk=m.dk.map(x=>{if(typeof x==='string'&&x.startsWith('data:')){const k=hh(x);im[k]=x;return k}return x});delete m.dk}}));return[c,im]}
async function save(){
 if(!DB){try{localStorage.setItem(KEY,JSON.stringify(S));dirty=false;ask('Tersimpan di PERANGKAT INI saja. Petugas lain TIDAK bisa melihatnya karena database bersama tidak aktif (kemungkinan belum masuk dengan akun Claude).',()=>{},'OK')}catch(e){toast('Gagal menyimpan (penyimpanan penuh?)')}head();return}
 try{
  for(const r of S.reports){const[c,im]=strip(r),j=JSON.stringify(c);if(LAST['r'+r.id]===j)continue;
   for(const k in im)if(!IMG[k]){await DB.doc('imgs/'+k).set({d:im[k]});IMG[k]=im[k]}
   await DB.doc('reports/'+r.id).set({tgl:r.tgl,json:j});LAST['r'+r.id]=j}
  for(const k in S.months){const M=S.months[k];if(!LAST['m'+k]&&!M.pj&&!M.pw&&!M.dk&&!Object.keys(M.img||{}).length)continue;const j=JSON.stringify(M);if(LAST['m'+k]===j)continue;await DB.doc('months/'+k).set({json:j});LAST['m'+k]=j}
  dirty=false;toast('Tersimpan di database bersama ✓');
 }catch(e){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(x){}ask('GAGAL menyimpan ke database bersama ('+(e&&(e.code||e.message)||e)+'). Data hanya disimpan sementara di perangkat ini dan BELUM terlihat petugas lain. Kemungkinan akun ini belum punya hak mengubah — minta pemilik aplikasi memberi akses Contributor, lalu tekan Simpan lagi.',()=>{},'OK')}
 head();if(pend&&!dirty)applyRemote()}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}
function head(){const d=$('#dirty');if(d)d.textContent=dirty?'● Belum disimpan':''}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function months(){const s=new Set(S.reports.map(r=>mk(r.tgl)));if(view.m)s.add(view.m);return [...s].filter(Boolean).sort().reverse()}
function render(){view.home?renderHome():view.rk?renderRekap():view.id?renderForm():renderList()}
function renderList(){
 const ms=months();if(!view.m)view.m=ms[0]||new Date().toISOString().slice(0,7);
 if(!ms.includes(view.m))ms.unshift(view.m);
 const rs=S.reports.filter(r=>mk(r.tgl)===view.m).sort((a,b)=>a.tgl<b.tgl?-1:1),M=mo(view.m);
 $('#app').innerHTML=`<div class="top"><div class="row"><button data-a="home" title="Halaman depan">🏠</button><h1>📋 Bukti Pelaksanaan Pekerjaan</h1></div><button class="p" data-a="new">+ Laporan Hari Baru</button></div><div class="mu" style="margin:-4px 0 8px">${DB?`🟢 Database bersama aktif — ${Object.keys(RAW.reports).length} laporan tersimpan di database (tekan Simpan agar terkirim)`:'🟠 Mode lokal: data hanya di perangkat ini dan TIDAK terlihat petugas lain'}</div>${DB&&LOCAL&&LOCAL.reports.some(x=>!RAW.reports[x.id])?`<div class="card"><b>${LOCAL.reports.filter(x=>!RAW.reports[x.id]).length} laporan lama ada di perangkat ini.</b> <button class="p" data-a="imp">Pindahkan ke database bersama</button></div>`:''}
 <div class="tabs">${ms.map(m=>`<button class="${m===view.m?'on':''}" data-a="mon" data-m="${m}">${mName(m)}</button>`).join('')}<input type="month" id="pm" style="width:auto" value="${view.m}" title="Pilih bulan lain"></div>
 <div class="card"><h2>${mName(view.m)} — ${rs.length} laporan</h2>
 ${rs.map(r=>`<div class="day" style="padding:6px 0;border-top:1px solid var(--bd)"><div><b>${dm(r.tgl)}</b> <span class="mu">${esc(r.cust)} · ${r.floors.length} lantai · ${esc(r.petugas)}</span></div>
 <div class="row"><button data-a="open" data-id="${r.id}">Buka</button><button data-a="pdf1" data-id="${r.id}">PDF</button><button data-a="xls1" data-id="${r.id}">XLSX</button><button class="x" data-a="del" data-id="${r.id}">Hapus</button></div></div>`).join('')||'<p class="mu">Belum ada laporan bulan ini.</p>'}</div>
 <div class="card"><h2>Tanda tangan akhir bulan (${mName(view.m)})</h2><p class="mu">Isi setelah semua laporan bulan ini selesai. TTD berupa foto, akan dipakai di semua halaman PDF bulan ini.</p>
 <div class="g">${[['pj','Penanggung Jawab MOIKO'],['pw','Pengawas CUSTOMER'],['dk','Diketahui & Disetujui CUSTOMER']].map(([k,l])=>`<div class="sig"><label>${l}</label><input data-ms="${k}" placeholder="Nama" value="${esc(M[k])}">${M.img[k]?`<img src="${M.img[k]}"><button class="x" data-a="delimg" data-k="${k}">🗑 Hapus foto TTD</button>`:'<div class="mu" style="margin:14px 0">belum ada foto TTD</div>'}<input type="file" accept="image/*" data-img="${k}"></div>`).join('')}</div>
 <div class="row" style="margin-top:10px"><button class="s" data-a="save">💾 Simpan</button><button data-a="pdfm">📄 PDF Bulan Ini</button><button class="p" data-a="rk">📊 Buka Rekap Spreadsheet</button><button data-a="xls">⬇ Unduh XLSX</button><span class="dirty" id="dirty"></span></div></div>`;head()}
function renderForm(){
 const r=S.reports.find(x=>x.id===view.id);if(!r){view.id=null;return render()}
 const M=mo(mk(r.tgl)),f=(k,t)=>`<input ${t?`type="${t}"`:''} data-f="${k}" value="${esc(r[k])}">`,fr=(l,k,t)=>`<div class="fr"><b>${l}</b>:${k?f(k,t):'<input disabled>'}</div>`;
 const sig=[['Penanggung Jawab Pekerjaan<br>MOIKO','pj'],['Pengawas Pekerjaan<br>CUSTOMER','pw'],['Diketahui & Disetujui<br>CUSTOMER','dk']].map(([l,k])=>`<div>${l}${M.img[k]?`<img src="${M.img[k]}">`:'<div style="height:64px"></div>'}<div class="ln">${esc(M[k])}</div></div>`).join('');
 $('#app').innerHTML=`<div class="top"><div class="row"><button data-a="back">← Daftar</button><h1>Laporan ${dm(r.tgl)}</h1></div><div class="row"><span class="dirty" id="dirty"></span><button class="s" data-a="save">💾 Simpan</button><button data-a="pdf1" data-id="${r.id}">📄 PDF</button><button data-a="xls1" data-id="${r.id}">📊 XLSX</button></div></div>
 <div class="paper-wrap"><div class="paper"><div class="ph"><div class="logo"><i>PEST CONTROL</i><b>Moiko</b><i>ANTI RAYAP</i></div><div class="pt"><h3>PT. MOIKO MITSUBA INDONESIA</h3>Ruko Bisnis Grand Royal Blok A No. 38<br>Jl. Boulevard Permata Raya Taman Royal 1 Cipondoh - Kota Tangerang<br>Telp : (021) 2950 5617 (Hunting) | E-mail : moikoina@gmail.com</div></div>
 <div class="frame"><div class="ttl">BUKTI PELAKSANAAN PEKERJAAN</div>
 <div class="inf"><div>${fr('NAMA PELANGGAN','cust')}${fr('ALAMAT','addr')}${fr('','')}${fr('HARI / TGL','tgl','date')}</div><div>${fr('NAMA PETUGAS','petugas')}${fr('','')}${fr('WAKTU DATANG','datang','time')}${fr('WAKTU PULANG','pulang','time')}</div></div>
 <table style="width:100%;table-layout:fixed;border-collapse:collapse"><colgroup><col style="width:44px"><col><col span="6" style="width:34px"><col span="9" style="width:30px"><col style="width:84px"><col style="width:90px"><col style="width:34px"></colgroup>
 <thead><tr><th rowspan="2">NO.</th><th rowspan="2">AREA / LOKASI</th><th colspan="6">METODE TREATMENT</th><th colspan="9">TEMUAN HAMA</th><th rowspan="2">DOKUMENTASI</th><th rowspan="2">PARAF</th><th class="o" rowspan="2"></th></tr>
 <tr>${MET.map(m=>`<th>${m}</th>`).join('')}${PEST.map(p=>`<th class="v">${p}</th>`).join('')}</tr></thead><tbody>
 ${r.floors.map((fl,i)=>`<tr class="fh"><td></td><td class="a"><input data-fl="${i}" data-k="name" value="${esc(fl.name)}" placeholder="Lantai … (Gedung …)"></td><td colspan="17"></td><td class="o"><button class="x" data-a="delf" data-i="${i}">✕</button></td></tr>
 ${fl.rooms.map((rm,j)=>`<tr><td>${j===0?`<input data-fl="${i}" data-k="no" value="${esc(fl.no)}" style="text-align:center">`:''}</td><td class="a"><input data-fl="${i}" data-r="${j}" data-k="n" value="${esc(rm.n)}" placeholder="R. … / - Toilet"></td>
 ${rm.m.map((v,k)=>`<td><input type="checkbox" data-fl="${i}" data-r="${j}" data-mt="${k}" ${v?'checked':''}></td>`).join('')}
 ${rm.h.map((v,k)=>`<td><input inputmode="numeric" style="text-align:center" data-fl="${i}" data-r="${j}" data-h="${k}" value="${esc(v)}"></td>`).join('')}
 <td><button class="pfb" data-a="dk" data-i="${i}" data-j="${j}" title="Dokumentasi foto">${dkc(rm)[0]?`<img src="${dkc(rm)[0]}">`:'📷'}${dkc(rm).length>1?` <small>+${dkc(rm).length-1}</small>`:''}</button></td><td><button class="pfb" data-a="pf" data-i="${i}" data-j="${j}" title="Klik untuk paraf">${rm.pi?`<img src="${rm.pi}">`:'✍'}</button></td><td class="o"><button class="x" data-a="delr" data-i="${i}" data-j="${j}">✕</button></td></tr>`).join('')}
 <tr><td class="o" colspan="20" style="text-align:left"><button data-a="addr" data-i="${i}">+ Ruangan di lantai ini</button></td></tr>`).join('')}
 </tbody></table></div>
 <div class="kt"><b>Keterangan :</b> (S) Spray, (CF) Cold Fogger, (HF) Hot Fogging, (BT) Baiting, (PJ) Perangkap/Jebakan, (TB) Tabur</div>
 <div class="bt"><div><b style="font-size:13px">Penggunaan Chemical</b><table style="width:100%;table-layout:fixed"><tr><th style="width:36px">No</th><th>Bahan Aktif</th><th style="width:70px">Jml</th></tr>${r.chem.map((c,i)=>`<tr><td>${i+1}</td><td><input data-c="${i}" data-k="a" value="${esc(c.a)}"></td><td><input data-c="${i}" data-k="j" value="${esc(c.j)}"></td></tr>`).join('')}</table></div>
 <div class="cb"><b style="font-size:13px">Catatan :</b><textarea data-f="cat">${esc(r.cat)}</textarea></div></div>
 <div class="sg">${sig}</div></div></div>
 <div class="row" style="margin-bottom:8px"><button class="p" data-a="addf">+ Lantai Berikutnya (No. ${r.floors.length+1})</button></div>
 <p class="mu">Tanda tangan diisi di akhir bulan lewat halaman Daftar. Kolom tombol ✕ tidak ikut tercetak.</p>`;head()}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;const a=b.dataset.a,r=S.reports.find(x=>x.id===view.id);
 if(a==='new'){const l=[...S.reports].sort((x,y)=>x.tgl<y.tgl?1:-1)[0]||{},t=new Date().toISOString().slice(0,10);
  const n={id:uid(),tgl:view.m&&view.m!==t.slice(0,7)?view.m+'-01':t,cust:l.cust||'',addr:l.addr||'',petugas:l.petugas||'',datang:l.datang||'08:00',pulang:l.pulang||'16:00',floors:[newFloor(1)],chem:[1,2,3,4,5].map(()=>({a:'',j:''})),cat:''};
  S.reports.push(n);view.id=n.id;dirty=true;render()}
 else if(a==='open'){view.id=b.dataset.id;render()}
 else if(a==='back'){const go=()=>{view.m=mk(r.tgl);view.id=null;if(dirty){dirty=false;if(DB){applyRemote();return}try{const x=localStorage.getItem(KEY);if(x)S=JSON.parse(x)}catch(e){}}if(pend&&DB){applyRemote();return}render()};dirty?ask('Ada perubahan yang belum disimpan. Kembali tanpa menyimpan?',go,'Kembali'):go()}
 else if(a==='mon'){view.m=b.dataset.m;render()}
 else if(a==='delimg'){const k=b.dataset.k;ask('Hapus foto TTD ini?',()=>{delete mo(view.m).img[k];dirty=true;renderList();save()})}
 else if(a==='cp'){const i=$('#lk');i.select();try{navigator.clipboard.writeText(i.value).then(()=>toast('Link disalin ✓'),()=>toast('Tekan lama pada link lalu pilih Salin'))}catch(e){toast('Tekan lama pada link lalu pilih Salin')}}
 else if(a==='rk'){view.home=false;view.rk=true;render()}
 else if(a==='enter'){view.home=false;render()}
 else if(a==='home'){view.home=true;view.rk=false;render()}
 else if(a==='rkb'){view.rk=false;render()}
 else if(a==='imp'){const L=LOCAL.reports.filter(x=>!RAW.reports[x.id]);S.reports.push(...L.filter(x=>!S.reports.find(y=>y.id===x.id)));for(const k in LOCAL.months){const m=S.months[k];if(!m||!(m.pj||m.pw||m.dk))S.months[k]=LOCAL.months[k]}dirty=true;save().then(()=>{LOCAL=null;render()})}
 else if(a==='dk')openDk(+b.dataset.i,+b.dataset.j);
 else if(a==='pf')openPad(+b.dataset.i,+b.dataset.j);
 else if(a==='xls1'){const q=S.reports.find(x=>x.id===(b.dataset.id||view.id));dl(()=>mkXls([q]),'Laporan_'+q.tgl+'.xlsx')}
 else if(a==='save')save();
 else if(a==='del'){const id=b.dataset.id;ask('Hapus laporan ini?',async()=>{S.reports=S.reports.filter(x=>x.id!==id);if(DB){try{await DB.doc('reports/'+id).delete();delete RAW.reports[id];delete LAST['r'+id]}catch(e){toast('Gagal menghapus di database')}}await save();render()})}
 else if(a==='addf'){r.floors.push(newFloor(r.floors.length+1));dirty=true;render()}
 else if(a==='addr'){r.floors[+b.dataset.i].rooms.push(newRoom());dirty=true;render()}
 else if(a==='delr'){r.floors[+b.dataset.i].rooms.splice(+b.dataset.j,1);dirty=true;render()}
